<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thank You</title>

<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #ffe5b4, #fff7e8);
  font-family: "Georgia", serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.thank-card {
  background: #fffaf0;
  padding: 50px;
  border-radius: 20px;
  text-align: center;
  font-size: 1.6rem;
  color: #8a5a00;
  border: 8px solid;
  border-image: linear-gradient(135deg, #d7b374, #f9e4b7, #d5a555) 1;
  box-shadow: 0 12px 35px rgba(0,0,0,0.2);
}
</style>

</head>
<body>

<div class="thank-card">
  💐 Thank you for sharing your details!  
  <br><br>
  We are grateful for your presence.
</div>

</body>
</html>
